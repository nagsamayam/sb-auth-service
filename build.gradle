plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.11.0'
    id 'io.github.pozafly.spotlessbridge' version '0.2.3'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

repositories {
  mavenCentral()
}

ext {
    shedlockVersion = '7.11.0'
}

spotless {
    java {
        // Apply Palantir Java Format (120-char line length, 4-space indent)
        palantirJavaFormat('2.103.0')

        // Clean up imports automatically
        removeUnusedImports()
        importOrder('java', 'javax', 'jakarta', 'org', 'com', '')

        // Enforce clean file endings
        trimTrailingWhitespace()
        endWithNewline()

        // Exclude generated sources (e.g., MapStruct, QueryDSL, OpenAPI)
        targetExclude 'build/generated/**'
    }

    // Format Gradle scripts, YAML, and Markdown files
    format 'misc', {
        target '*.gradle', '*.md', '.gitignore', 'src/**/*.yml', 'src/**/*.yaml'
        trimTrailingWhitespace()
        leadingTabsToSpaces(2)
        endWithNewline()
    }
}

dependencies {
    implementation("org.springframework.boot:spring-boot-starter-actuator")
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation("org.springframework.boot:spring-boot-starter-oauth2-resource-server")

    implementation "net.javacrumbs.shedlock:shedlock-spring:${shedlockVersion}"
    implementation "net.javacrumbs.shedlock:shedlock-provider-jdbc-template:${shedlockVersion}"

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j:8.4.0'
    annotationProcessor 'org.projectlombok:lombok'

    // Flyway Database Migration Core + MySQL Extension
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'

    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
  useJUnitPlatform()
}

tasks.register('installGitHooks', Copy) {
    from new File(rootProject.rootDir, 'scripts/pre-commit')
    into { new File(rootProject.rootDir, '.git/hooks') }
    filePermissions {
        unix(0755)
    }
}

// Automatically install the hook whenever someone builds or checks the project
tasks.named('build') {
    dependsOn 'installGitHooks'
}
